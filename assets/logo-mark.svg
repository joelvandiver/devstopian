<svg width="72" height="72" viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Dev·stopian pole star mark">
  <defs>
    <radialGradient id="lm-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff"></stop>
      <stop offset="0.35" stop-color="#bff8f0" stop-opacity="0.55"></stop>
      <stop offset="1" stop-color="#38d9e0" stop-opacity="0"></stop>
    </radialGradient>
    <linearGradient id="lm-spike" x1="36" y1="2" x2="36" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"></stop>
      <stop offset="0.5" stop-color="#ffffff"></stop>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"></stop>
    </linearGradient>
  </defs>

  <!-- soft halo -->
  <circle cx="36" cy="36" r="26" fill="url(#lm-glow)"></circle>

  <!-- diffraction spikes (long vertical/horizontal + short diagonals) -->
  <g fill="url(#lm-spike)">
    <path d="M36 4 C 37.6 33, 38 34.4, 67 36 C 38 37.6, 37.6 38, 36 68 C 34.4 38, 34 37.6, 5 36 C 34 34.4, 34.4 33, 36 4 Z" opacity="0.95"></path>
    <path d="M36 18 C 36.9 34.2, 37.1 34.9, 53 36 C 37.1 37.1, 36.9 37.8, 36 54 C 35.1 37.8, 34.9 37.1, 19 36 C 34.9 34.9, 35.1 34.2, 36 18 Z" transform="rotate(45 36 36)" opacity="0.5"></path>
  </g>

  <!-- core -->
  <circle cx="36" cy="36" r="4.5" fill="#ffffff"></circle>
</svg>
