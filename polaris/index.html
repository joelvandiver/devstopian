<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Polaris – Geometric Vector Graphics</title>
    <style>
      /* ------------------------------------------------------------------
         Polaris studio theme
         Design tokens first; every rule below draws from these so the
         palette can evolve in one place.
         ------------------------------------------------------------------ */
      :root {
        --bg: #07090f;            /* deep ink behind everything */
        --canvas: #0a0d16;        /* drawing surface */
        --panel: #0d1119;         /* chrome panels */
        --panel-raised: #131826;  /* buttons, inputs */
        --edge: #1d2536;          /* hairline borders */
        --edge-soft: #161d2c;
        --ink: #e9ecf5;           /* primary text */
        --ink-dim: #98a2bc;       /* secondary text */
        --ink-faint: #6a7592;     /* tertiary text */
        --gold: #e3b87e;          /* warm accent — active states */
        --gold-soft: rgba(227, 184, 126, 0.12);
        --gold-line: rgba(227, 184, 126, 0.55);
        --blue: #9fc4ff;          /* cool accent — focus, links */
        --grid-fine: rgba(64, 84, 128, 0.14);
        --grid-major: rgba(90, 112, 160, 0.22);
        --serif: Georgia, "Iowan Old Style", "Times New Roman", serif;
        --sans: "Avenir Next", "Segoe UI", system-ui, sans-serif;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background: var(--bg);
        color: var(--ink);
        font-family: var(--sans);
        display: flex;
        flex-direction: column;
        height: 100vh;
        overflow: hidden;
      }

      /* ---- header ------------------------------------------------------ */

      header {
        background: linear-gradient(180deg, #10141f 0%, var(--panel) 100%);
        border-bottom: 1px solid var(--edge);
        padding: 0.65rem 1.25rem;
        display: flex;
        align-items: center;
        gap: 1rem;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 0.9rem;
      }

      .brand-mark {
        width: 2.15rem;
        height: 2.15rem;
        flex: 0 0 auto;
        filter: drop-shadow(0 0 6px rgba(159, 196, 255, 0.25));
      }

      .brand-copy {
        display: flex;
        flex-direction: column;
        gap: 0.12rem;
      }

      header h1 {
        font-size: 1.02rem;
        line-height: 1;
        letter-spacing: 0.34em;
        text-transform: uppercase;
        color: var(--ink);
        font-weight: 600;
      }

      header .subtitle {
        font-family: var(--serif);
        font-style: italic;
        font-size: 0.82rem;
        letter-spacing: 0.02em;
        color: var(--ink-dim);
      }

      /* ---- toolbar ----------------------------------------------------- */

      #toolbar {
        background: var(--panel);
        border-bottom: 1px solid var(--edge);
        padding: 0.45rem 1rem;
        display: flex;
        gap: 0.5rem;
        align-items: center;
        flex-wrap: wrap;
      }

      #toolbar label {
        font-size: 0.66rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--ink-faint);
        margin-left: 0.9rem;
      }

      button {
        background: var(--panel-raised);
        color: var(--ink);
        border: 1px solid var(--edge);
        border-radius: 999px;
        padding: 0.34rem 0.95rem;
        cursor: pointer;
        font-family: var(--sans);
        font-size: 0.83rem;
        letter-spacing: 0.02em;
        transition: background 0.15s ease, border-color 0.15s ease,
          color 0.15s ease, box-shadow 0.15s ease;
      }

      button:hover {
        background: #1a2135;
        border-color: #2d3a58;
      }

      button:focus-visible {
        outline: 2px solid var(--blue);
        outline-offset: 2px;
      }

      button.active {
        background: var(--gold-soft);
        border-color: var(--gold-line);
        color: var(--gold);
        box-shadow: 0 0 10px rgba(227, 184, 126, 0.16);
      }

      /* ---- layout ------------------------------------------------------ */

      #main {
        flex: 1;
        display: flex;
        overflow: hidden;
      }

      /* ---- tool palette ------------------------------------------------ */

      #tool-palette {
        width: 66px;
        background: var(--panel);
        border-right: 1px solid var(--edge);
        padding: 0.75rem 0.5rem;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 0.5rem;
      }

      #tool-palette button {
        width: 100%;
        min-height: 44px;
        padding: 0;
        border-radius: 10px;
        color: var(--ink-dim);
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      #tool-palette button:hover {
        color: var(--ink);
      }

      #tool-palette button.active {
        color: var(--gold);
      }

      #tool-palette button svg {
        width: 1.1rem;
        height: 1.1rem;
      }

      /* ---- viewport ---------------------------------------------------- */

      #viewport {
        flex: 1;
        position: relative;
        overflow: hidden;
        cursor: crosshair;
        background:
          linear-gradient(var(--grid-major) 1px, transparent 1px),
          linear-gradient(90deg, var(--grid-major) 1px, transparent 1px),
          linear-gradient(var(--grid-fine) 1px, transparent 1px),
          linear-gradient(90deg, var(--grid-fine) 1px, transparent 1px),
          var(--canvas);
        background-size:
          200px 200px,
          200px 200px,
          40px 40px,
          40px 40px,
          auto;
        background-position: 0 0;
      }

      /* gentle vignette so the eye settles on the construction */
      #viewport::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(
          ellipse 120% 100% at 50% 45%,
          transparent 58%,
          rgba(4, 6, 11, 0.42) 100%
        );
      }

      svg {
        display: block;
        width: 100%;
        height: 100%;
      }

      /* ---- sidebar ----------------------------------------------------- */

      #sidebar {
        width: 232px;
        background: var(--panel);
        border-left: 1px solid var(--edge);
        padding: 0.9rem;
        overflow-y: auto;
        font-size: 0.82rem;
        scrollbar-width: thin;
        scrollbar-color: var(--edge) transparent;
      }

      #sidebar h2 {
        font-size: 0.68rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        font-weight: 600;
        color: var(--ink-faint);
        margin-bottom: 0.7rem;
        border-bottom: 1px solid var(--edge-soft);
        padding-bottom: 0.45rem;
      }

      .element-item {
        padding: 0.3rem 0.5rem;
        border-radius: 6px;
        border-left: 2px solid transparent;
        color: var(--ink-dim);
        cursor: pointer;
        transition: background 0.12s ease, border-color 0.12s ease,
          color 0.12s ease;
      }

      .element-item:hover {
        background: var(--panel-raised);
        border-left-color: var(--gold-line);
        color: var(--ink);
      }

      .element-item strong {
        color: var(--gold);
        font-weight: 600;
      }

      /* ---- status bar -------------------------------------------------- */

      #status {
        font-family: var(--serif);
        font-style: italic;
        font-size: 0.78rem;
        color: var(--ink-dim);
        padding: 0.35rem 1.1rem;
        background: var(--panel);
        border-top: 1px solid var(--edge-soft);
      }

      /* ---- inputs ------------------------------------------------------ */

      input[type="color"] {
        width: 1.7rem;
        height: 1.7rem;
        border: 1px solid var(--edge);
        border-radius: 50%;
        background: none;
        cursor: pointer;
        padding: 2px;
        vertical-align: middle;
        transition: border-color 0.15s ease;
      }

      input[type="color"]:hover {
        border-color: var(--gold-line);
      }

      input[type="color"]::-webkit-color-swatch-wrapper {
        padding: 0;
      }

      input[type="color"]::-webkit-color-swatch {
        border: none;
        border-radius: 50%;
      }

      input[type="color"]::-moz-color-swatch {
        border: none;
        border-radius: 50%;
      }

      input[type="range"] {
        width: 74px;
        vertical-align: middle;
        accent-color: var(--gold);
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 48 48" aria-hidden="true">
          <defs>
            <linearGradient id="brand-glow" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#f8fbff" />
              <stop offset="55%" stop-color="#9fd6ff" />
              <stop offset="100%" stop-color="#7b87ff" />
            </linearGradient>
          </defs>
          <circle cx="24" cy="24" r="20" fill="none" stroke="#24314f" stroke-width="1.5" />
          <circle cx="24" cy="24" r="11.5" fill="none" stroke="#24314f" stroke-width="1" />
          <path
            d="M24 6 L27.8 20.2 L42 24 L27.8 27.8 L24 42 L20.2 27.8 L6 24 L20.2 20.2 Z"
            fill="url(#brand-glow)"
          />
          <circle cx="24" cy="24" r="3.2" fill="#060814" stroke="#e4efff" stroke-width="1.2" />
        </svg>
        <div class="brand-copy">
          <h1>Polaris</h1>
          <span class="subtitle">Geometric Vector Graphics</span>
        </div>
      </div>
    </header>

    <div id="toolbar">
      <span style="flex:1"></span>
      <label>Stroke</label>
      <input type="color" id="stroke-color" value="#b8dcff" />
      <label>Fill</label>
      <input type="color" id="fill-color" value="#6b4fa3" />
      <label>Width</label>
      <input type="range" id="stroke-width" min="0.5" max="8" step="0.5" value="1.5" />
      <button id="btn-intersect" title="Add points at every line/circle and circle/circle intersection">Intersect</button>
      <button id="btn-midpoint" title="Add a point at the midpoint of every segment">Midpoint</button>
      <button id="btn-clear">Clear</button>
      <button id="btn-export-svg" title="Open the current SVG in a new tab">Open SVG</button>
    </div>

    <div id="main">
      <div id="tool-palette" aria-label="Drawing tools">
        <button id="btn-point" class="active" title="Place a point" aria-label="Place a point">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="3.5" fill="currentColor" />
          </svg>
        </button>
        <button id="btn-segment" title="Draw a segment" aria-label="Draw a segment">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="6" cy="18" r="2" fill="currentColor" />
            <circle cx="18" cy="6" r="2" fill="currentColor" />
            <path d="M7.4 16.6L16.6 7.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
          </svg>
        </button>
        <button id="btn-circle" title="Draw a circle" aria-label="Draw a circle">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8" />
          </svg>
        </button>
        <button id="btn-line" title="Draw an infinite line" aria-label="Draw an infinite line">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 20L20 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
          </svg>
        </button>
        <button id="btn-perpendicular" title="Perpendicular line: click a reference line, then a point" aria-label="Draw a perpendicular line">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 19h16M12 19V5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
          </svg>
        </button>
        <button id="btn-parallel" title="Parallel line: click a reference line, then a point" aria-label="Draw a parallel line">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 20L15 4M9 20L19 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
          </svg>
        </button>
      </div>
      <div id="viewport">
        <svg id="scene" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>
      <div id="sidebar">
        <h2>Elements</h2>
        <div id="element-list"></div>
      </div>
    </div>

    <div id="status">Ready — click in the workspace to start drawing</div>

    <script type="module" src="main.js"></script>
  </body>
</html>
